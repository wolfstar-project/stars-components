packages:
    - 'docs'
    - 'packages/*'

autoInstallPeers: true

dedupePeers: true

linkWorkspacePackages: true

preferWorkspacePackages: true

strictPeerDependencies: false

overrides:
    '@types/pg': '8.20.0'
    ansi-regex: '^6.2.2'
    esbuild: '^0.28.0'
    minimist: '1.2.8'
    # Keep VitePress on Vite 8, but pin Vitest/test tooling to Vite 6 so
    # TypeScript experimental decorators continue to transform via esbuild.
    'vitest>vite': '6.4.3'
    '@vitest/mocker>vite': '6.4.3'
    '@redstardev/unplugin-version-injector>vite': '6.4.3'

allowBuilds:
    '@swc/core': true
    esbuild: true
    sharp: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - '@redstardev/*'
    - unrun@0.3.1
    - vitepress@2.0.0-alpha.18
    - '@shikijs/vitepress-twoslash@4.3.1'
    - vitepress-plugin-group-icons@1.7.5
    - vitepress-plugin-llms@1.13.3
    - markdown-it-image-size@15.0.1
    - vite@6.4.3
    - '@wolfstar/plugin-i18next@1.0.1-next-20260830111821'
