packages:
    - 'packages/*'
    - 'examples/*'

autoInstallPeers: true

dedupePeers: true

linkWorkspacePackages: true

preferWorkspacePackages: true

strictPeerDependencies: false

overrides:
    ansi-regex: '^6.3.0'
    esbuild: '^0.28.2'
    minimist: '1.2.8'

allowBuilds:
    '@swc/core': true
    esbuild: true
    sharp: true

minimumReleaseAge: 1440

# Plugins published from wolfstar-project/plugins (the examples install them) come from this organization's own
# trusted-publishing workflows, so they skip the supply-chain quarantine above. Other first-party packages keep it.
minimumReleaseAgeExclude:
    - '@wolfstar/plugin-*'
