name: PR Labeler
on:
    pull_request_target:
        types:
            - opened
            - edited
            - reopened
            - synchronize
jobs:
    label:
        name: Label
        if: github.event.action != 'edited'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Label pull request
              uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
              with:
                  repo-token: '${{ secrets.WOLFSTAR_TOKEN }}'
                  sync-labels: true
