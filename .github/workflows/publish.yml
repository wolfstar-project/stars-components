name: Publish
run-name: Publish @wolfstar/${{ github.event.inputs.package }}

on:
    workflow_dispatch:
        inputs:
            package:
                description: The package to release
                required: true
                type: choice
                options:
                    - env-utilities
                    - http-framework
                    - http-framework-i18n
                    - i18next-backend
                    - influx-utilities
                    - logger
                    - reddit-helpers
                    - safe-fetch
                    - shared-http-pieces
                    - shared-influx-pieces
                    - start-banner
                    - twitch-helpers
                    - weather-helpers

permissions: {}

jobs:
    publish:
        name: Publish @wolfstar/${{ github.event.inputs.package }} npm
        runs-on: ubuntu-latest
        if: github.repository_owner == 'wolfstar-project'
        permissions:
            id-token: write
            contents: write
        environment: npm
        steps:
            - name: Checkout Project
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: main
                  persist-credentials: false
                  token: ${{ secrets.WOLFSTAR_TOKEN }}
            - name: Configure Git credentials
              run: git config --global url."https://x-access-token:${WOLFSTAR_TOKEN}@github.com/".insteadOf "https://github.com/"
              env:
                  WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm turbo run build --filter @wolfstar/${{ github.event.inputs.package }}
            - name: Publish to NPM
              working-directory: packages/${{ env.PACKAGE }}
              run: pnpm publish --provenance --access public --no-git-checks
              env:
                  PACKAGE: ${{ github.event.inputs.package }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
