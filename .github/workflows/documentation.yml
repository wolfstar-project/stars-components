name: documentation

on:
    push:
        branches:
            - main
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docs:
        uses: wolfstar-project/.github/.github/workflows/reusable-documentation.yml@a0105931cfbee0f77fde9a5f8c3e8f1bb55edb7e # main
        with:
            project-name: stars-components
            docgen-command: pnpm exec typedoc --options typedoc.json --json docs-output/api.json
            docs-repository: wolfstar-project/docs
        secrets:
            WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
