name: Continuous Delivery

on:
    push:
        branches:
            - main

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    publish:
        name: Publish Next to npm
        runs-on: ubuntu-latest
        if: |
            github.repository_owner == 'wolfstar-project'
            && !contains(github.event.head_commit.message, 'version packages')
        permissions:
            id-token: write
            contents: read
        environment: npm
        strategy:
            fail-fast: false
            matrix:
                package:
                    - env-utilities
                    - http-framework
                    - http-framework-i18n
                    - i18next-backend
                    - influx-utilities
                    - logger
                    - reddit-helpers
                    - safe-fetch
                    - shared-http-pieces
                    - shared-influx-pieces
                    - start-banner
                    - twitch-helpers
                    - weather-helpers
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Build package
              run: pnpm turbo run build --filter @wolfstar/${{ matrix.package }}
            - name: Set pre-release version
              run: |
                  node --input-type=module --eval "
                    import { readFileSync, writeFileSync } from 'fs';
                    const pkgPath = 'packages/${{ matrix.package }}/package.json';
                    const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'));
                    pkg.version = pkg.version + '-next.' + '${{ github.sha }}'.slice(0, 7);
                    writeFileSync(pkgPath, JSON.stringify(pkg, null, '\t') + '\n');
                    console.log('Set version to', pkg.version);
                  "
            - name: Publish to npm
              run: pnpm publish --tag next --provenance --access public --no-git-checks
              working-directory: packages/${{ matrix.package }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
