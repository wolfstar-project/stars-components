name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    Linting:
        name: Lint & Format
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Add problem matchers
              run: |
                  echo "::add-matcher::.github/problemMatchers/oxlint.json"
                  echo "::add-matcher::.github/problemMatchers/oxfmt.json"
            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Run lint
              run: pnpm lint

    Building:
        name: Build & Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            actions: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Add problem matchers
              run: echo "::add-matcher::.github/problemMatchers/tsc.json"
            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Build code
              run: pnpm build
            - name: Typecheck code
              run: pnpm typecheck

    UnitTesting:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Run unit tests
              run: pnpm test
            - name: Store code coverage report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage
                  path: coverage/

    Changesets:
        name: Verify changesets
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: |
            github.event_name == 'pull_request'
            && github.event.pull_request.title != 'Version Packages'
            && !startsWith(github.head_ref, 'changeset-release/')
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
              with:
                  runtime: node@24
                  cache: true
                  install: false
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Verify changesets
              run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

    Upload_Coverage_Report:
        name: Upload coverage report to codecov
        needs: UnitTesting
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.repository_owner == 'wolfstar-project'
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - name: Download NodeJS Unit Test Coverage report
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: coverage
                  path: coverage/
            - name: Codecov Upload
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true
