name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    Linting:
        name: Lint & Format
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Add problem matchers
              run: |
                  echo "::add-matcher::.github/problemMatchers/oxlint.json"
                  echo "::add-matcher::.github/problemMatchers/oxfmt.json"
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Run lint
              run: pnpm lint

    Building:
        name: Build & Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            actions: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Add problem matchers
              run: echo "::add-matcher::.github/problemMatchers/tsc.json"
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Build code
              run: pnpm build
            - name: Typecheck code
              run: pnpm typecheck

    UnitTesting:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Run unit tests
              run: pnpm test
            - name: Store code coverage report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage
                  path: coverage/

    Upload_Coverage_Report:
        name: Upload coverage report to codecov
        needs: UnitTesting
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.repository_owner == 'wolfstar-project'
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - name: Download NodeJS Unit Test Coverage report
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: coverage
                  path: coverage/
            - name: Codecov Upload
              uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true
