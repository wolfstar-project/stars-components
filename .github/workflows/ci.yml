name: ci

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    merge_group:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: true

jobs:
    lint:
        name: 🔠 Lint project
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 15

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm lint

    build:
        name: 🏗️ Build & Typecheck
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 15
        permissions:
            contents: read
            actions: write

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: true

            - name: Add problem matchers
              run: echo "::add-matcher::.github/problemMatchers/tsc.json"

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build code
              run: pnpm build

            - name: Typecheck code
              run: pnpm typecheck

    unit:
        name: 🧪 Unit tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Windows only runs @wolfstar/cli: it is the one package with platform-sensitive code (process
                    # spawning, path handling), the rest is exercised by the ubuntu run below with coverage.
                    - os: ubuntu-24.04-arm
                      command: pnpm test -- --reporter=default --reporter=junit --outputFile=test-report.junit.xml
                      coverage: true
                    - os: windows-latest
                      command: pnpm --filter @wolfstar/cli test
                      coverage: false

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: ${{ matrix.command }}

            - name: Upload test results to Codecov
              if: ${{ matrix.coverage && !cancelled() && github.repository_owner == 'wolfstar-project' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: test-report.junit.xml
                  flags: unit
                  report_type: test_results
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Upload coverage reports to Codecov
              if: ${{ matrix.coverage && !cancelled() && github.repository_owner == 'wolfstar-project' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: coverage/lcov.info,coverage/clover.xml
                  flags: unit
                  token: ${{ secrets.CODECOV_TOKEN }}

    benchmark:
        name: ⏱️ Benchmarks
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Forks have no access to `CODSPEED_TOKEN`, and a merge-queue run has no base to compare against.
        if: github.repository_owner == 'wolfstar-project' && github.event_name != 'merge_group'

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run benchmarks
              uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
              with:
                  run: pnpm bench
                  mode: simulation
                  token: ${{ secrets.CODSPEED_TOKEN }}

    knip:
        name: 🧹 Unused code check
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 10

        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Check for unused code
              run: pnpm exec knip

    changesets:
        name: 🦋 Verify changesets
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 10
        if: |
            github.event_name == 'pull_request'
            && github.event.pull_request.title != 'chore: update changelog and release'
            && !startsWith(github.head_ref, 'changeset-release/')
        steps:
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm + Node.js v24
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify changesets
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: pnpm exec changeset status --since=origin/${BASE_REF}
