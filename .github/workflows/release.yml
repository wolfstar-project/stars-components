name: release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    snapshot_filter:
        name: Snapshot filter
        runs-on: ubuntu-latest
        if: |
            github.repository_owner == 'wolfstar-project'
            && (
                (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: version packages'))
                || github.event_name == 'workflow_dispatch'
            )
        permissions:
            contents: read
        outputs:
            publish: ${{ steps.snapshot_changes.outputs.publish }}
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Check snapshot changes
              id: snapshot_changes
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(packages/|package.json$|pnpm-lock.yaml$)'; then
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "publish=false" >> "$GITHUB_OUTPUT"
                  fi

    snapshot:
        name: Publish @next snapshot
        runs-on: ubuntu-latest
        needs: snapshot_filter
        if: |
            github.repository_owner == 'wolfstar-project'
            && needs.snapshot_filter.outputs.publish == 'true'
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Publish snapshot
              run: pnpm publish:snapshot
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true

    release:
        name: Create Release PR or Publish
        runs-on: ubuntu-latest
        if: github.repository_owner == 'wolfstar-project'
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Configure Git credentials
              run: git config --global url."https://x-access-token:${WOLFSTAR_TOKEN}@github.com/".insteadOf "https://github.com/"
              env:
                  WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
            - name: Create Release Pull Request or Publish
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  publish: pnpm release
                  version: pnpm version
                  title: 'Version Packages'
                  commit: 'chore: version packages'
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
