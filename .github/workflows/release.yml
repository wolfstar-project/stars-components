name: release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Create Release PR or Publish
        runs-on: ubuntu-latest
        if: github.repository_owner == 'wolfstar-project'
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Configure Git credentials
              run: git config --global url."https://x-access-token:${WOLFSTAR_TOKEN}@github.com/".insteadOf "https://github.com/"
              env:
                  WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
            - name: Create Release Pull Request or Publish
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  publish: pnpm release
                  version: pnpm version
                  title: 'Version Packages'
                  commit: 'chore: version packages'
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
