name: Publish dev

on:
    schedule:
        - cron: '0 */12 * * *'
    workflow_dispatch:
        inputs:
            ref:
                description: 'The ref to check out. e.g. main, feat/new-feature'
                required: false
                default: main
            tag:
                description: 'The tag to use, generally a feature name (default: next)'
                required: false
                type: string
            dry_run:
                description: 'Perform a dry run that skips publishing and outputs logs indicating what would have happened'
                type: boolean
                default: false

permissions: {}

jobs:
    check-npm-token:
        name: Check npm publish token
        runs-on: ubuntu-latest
        if: github.repository_owner == 'wolfstar-project'
        outputs:
            configured: ${{ steps.check.outputs.configured }}
        steps:
            - name: Check NPM_PUBLISH_TOKEN
              id: check
              env:
                  NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
              run: |
                  if [ -n "$NPM_PUBLISH_TOKEN" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "Skipping publish: NPM_PUBLISH_TOKEN is not configured at repository level."
                    echo "Set it with: gh secret set NPM_PUBLISH_TOKEN --repo ${{ github.repository }}"
                  fi

    npm-publish:
        name: npm publish
        runs-on: ubuntu-latest
        needs: check-npm-token
        if: needs.check-npm-token.outputs.configured == 'true'
        permissions:
            contents: read
        steps:
            - name: Checkout Project
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref || 'main' }}
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Setup Node.js v24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org/

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm turbo run build

            - name: Publish packages
              run: |
                  TAG="${INPUT_TAG:-next}"
                  SHA=$(git rev-parse --short HEAD)
                  RUN="${{ github.run_number }}.${{ github.run_attempt }}"
                  DRY_RUN="$INPUT_DRY_RUN"

                  PACKAGES=(
                    env-utilities
                    http-framework
                    http-framework-i18n
                    i18next-backend
                    influx-utilities
                    logger
                    reddit-helpers
                    safe-fetch
                    shared-http-pieces
                    shared-influx-pieces
                    start-banner
                    twitch-helpers
                    weather-helpers
                  )

                  for PACKAGE in "${PACKAGES[@]}"; do
                    PKG="$PACKAGE" TAG="$TAG" SHA="$SHA" RUN="$RUN" node --input-type=module --eval "
                      import { readFileSync, writeFileSync } from 'fs';
                      const { PKG, TAG, SHA, RUN } = process.env;
                      const pkgPath = 'packages/' + PKG + '/package.json';
                      const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'));
                      pkg.version = pkg.version + '-' + TAG + '.' + SHA + '.' + RUN;
                      writeFileSync(pkgPath, JSON.stringify(pkg, null, '\t') + '\n');
                      console.log('Bumped', pkg.name, 'to', pkg.version);
                    "

                    if [[ "$DRY_RUN" == "true" ]]; then
                      echo "[dry-run] would publish @wolfstar/${PACKAGE} with tag ${TAG}"
                    else
                      # Trusted publishing is unavailable; NPM_PUBLISH_TOKEN (Automation) is required.
                      (cd "packages/${PACKAGE}" && pnpm publish --tag "${TAG}" --access public --no-git-checks) # zizmor: ignore[use-trusted-publishing]
                    fi
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  INPUT_TAG: ${{ inputs.tag }}
                  INPUT_DRY_RUN: ${{ inputs.dry_run }}
