name: Announce release
description: >-
    Post release news to a Discord webhook. `packages` renders npm releases from
    the changelogs with no AI; `draft` has the Pullfrog agent write a bot or
    site announcement for review; `post` sends a reviewed draft.
author: wolfstar-project

inputs:
    mode:
        description: '`packages`, `draft`, or `post`.'
        required: true
    github-token:
        description: Token used to read pull requests, comments, and compare refs.
        required: false
        default: ${{ github.token }}
    repository:
        description: The `owner/name` the release belongs to.
        required: false
        default: ${{ github.repository }}
    dry-run:
        description: Render and write the job summary, but send nothing to Discord.
        required: false
        default: 'false'

    # packages
    published-packages:
        description: '`packages` mode: the `publishedPackages` output of changesets/action (JSON `[{ name, version }]`).'
        required: false
        default: '[]'
    packages-dir:
        description: '`packages` mode: the folder that holds the packages, relative to the workspace.'
        required: false
        default: packages

    # draft
    kind:
        description: '`draft` mode: `bot` or `site`. A site draft can include the After screenshots from PR evidence comments.'
        required: false
        default: bot
    product:
        description: '`draft` mode: the name readers know, such as `WolfStar Alpha` or `wolfstar.rocks`.'
        required: false
        default: ''
    version:
        description: '`draft` mode: the version or tag being announced.'
        required: false
        default: ''
    from-ref:
        description: '`draft` mode: the previous release tag or commit. Pull requests merged after it are read.'
        required: false
        default: ''
    to-ref:
        description: '`draft` mode: the tag or commit being released.'
        required: false
        default: ${{ github.sha }}
    stage:
        description: '`draft` mode: `alpha`, `beta`, `preview`, `stable`, or `hotfix`. It decides the warning.'
        required: false
        default: stable
    format:
        description: '`draft` mode: `auto`, `text` (Skyra-style plain message), or `components` (Components V2 container).'
        required: false
        default: auto
    notes:
        description: '`draft` mode: facts from the maintainer the repository cannot tell, such as a deadline or a data reset.'
        required: false
        default: ''
    language:
        description: '`draft` mode: the language the announcement is written in.'
        required: false
        default: English
    include-open-pulls:
        description: '`draft` mode: read open pull requests for the Coming soon section.'
        required: false
        default: 'true'
    max-screenshots:
        description: '`draft` mode: the most After screenshots a site announcement carries.'
        required: false
        default: '3'
    ai-model:
        description: '`draft` mode: Pullfrog model override (a curated slug or a models.dev specifier). Empty uses the repository setting in the Pullfrog console.'
        required: false
        default: ''
    ai-effort:
        description: '`draft` mode: Pullfrog reasoning effort.'
        required: false
        default: medium
    ai-timeout:
        description: '`draft` mode: how long the Pullfrog agent may take.'
        required: false
        default: 15m

    # draft and post
    output-dir:
        description: Where `draft` writes the reviewed message and `post` reads it. Defaults to `$RUNNER_TEMP/announcement`.
        required: false
        default: ''

    # Discord
    webhook-url:
        description: The Discord webhook URL. Without it nothing is sent and the job summary keeps the preview.
        required: false
        default: ''
    thread-id:
        description: Post into this thread of a forum or media channel.
        required: false
        default: ''
    role-id:
        description: The role pinged by the first message, as in `New announcement for @Subscribers:`.
        required: false
        default: ''
    username:
        description: Override the webhook's display name.
        required: false
        default: ''
    avatar-url:
        description: Override the webhook's avatar.
        required: false
        default: ''
    button-label:
        description: '`draft` mode: label of the link button, such as `Invite WolfStar Alpha`.'
        required: false
        default: ''
    button-url:
        description: '`draft` mode: target of the link button, such as the invite URL.'
        required: false
        default: ''
    release-url:
        description: '`draft` mode: GitHub release page, linked from a second button.'
        required: false
        default: ''

    # Signed lifecycle callbacks (discord.js release workflow style)
    callback-url:
        description: Optional HTTPS endpoint that receives signed `started`, `drafted`, `completed`, and `failed` events.
        required: false
        default: ''
    callback-secret:
        description: HMAC-SHA256 key for `callback-url`. Both are needed, or neither.
        required: false
        default: ''

outputs:
    message-count:
        description: How many Discord messages were rendered.
        value: ${{ steps.run.outputs.message-count }}
    output-dir:
        description: The folder holding `message.json` and its attachments.
        value: ${{ steps.run.outputs.output-dir }}
    skipped:
        description: '`true` when there was nothing user-visible to announce.'
        value: ${{ steps.run.outputs.skipped || steps.collect.outputs.skipped }}

runs:
    using: composite
    steps:
        - name: Setup Node.js v24
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: 24

        # draft: collect the release context and write the agent prompt.
        - name: Collect release context
          id: collect
          if: inputs.mode == 'draft'
          shell: bash
          run: node "$GITHUB_ACTION_PATH/src/main.ts"
          env:
              INPUT_MODE: collect
              INPUT_REPOSITORY: ${{ inputs.repository }}
              INPUT_KIND: ${{ inputs.kind }}
              INPUT_PRODUCT: ${{ inputs.product }}
              INPUT_VERSION: ${{ inputs.version }}
              INPUT_FROM_REF: ${{ inputs.from-ref }}
              INPUT_TO_REF: ${{ inputs.to-ref }}
              INPUT_STAGE: ${{ inputs.stage }}
              INPUT_FORMAT: ${{ inputs.format }}
              INPUT_NOTES: ${{ inputs.notes }}
              INPUT_LANGUAGE: ${{ inputs.language }}
              INPUT_INCLUDE_OPEN_PULLS: ${{ inputs.include-open-pulls }}
              INPUT_MAX_SCREENSHOTS: ${{ inputs.max-screenshots }}
              INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              RELEASE_WEBHOOK_URL: ${{ inputs.callback-url }}
              RELEASE_WEBHOOK_SECRET: ${{ inputs.callback-secret }}

        # draft: the Pullfrog agent writes the announcement as JSON that matches
        # the schema. It cannot push, and the provider keys come from the env of
        # the step that calls this action.
        - name: Write the announcement with Pullfrog
          id: pullfrog
          if: inputs.mode == 'draft' && steps.collect.outputs.skipped != 'true'
          uses: pullfrog/pullfrog@0d318bef8c7cf7ae3f193ef32b2bc74e1d94b4d1 # v0.1.90
          with:
              prompt_file: ${{ steps.collect.outputs.prompt-file }}
              output_schema: ${{ steps.collect.outputs.schema }}
              model: ${{ inputs.ai-model }}
              effort: ${{ inputs.ai-effort }}
              timeout: ${{ inputs.ai-timeout }}
              push: disabled
              shell: restricted
              progress_comments: disabled
              token: ${{ inputs.github-token }}

        - name: Run
          id: run
          if: inputs.mode != 'draft' || steps.collect.outputs.skipped != 'true'
          shell: bash
          run: node "$GITHUB_ACTION_PATH/src/main.ts"
          env:
              INPUT_MODE: ${{ inputs.mode == 'draft' && 'render' || inputs.mode }}
              INPUT_AGENT_RESULT: ${{ steps.pullfrog.outputs.result }}
              INPUT_REPOSITORY: ${{ inputs.repository }}
              INPUT_DRY_RUN: ${{ inputs.dry-run }}
              INPUT_PUBLISHED_PACKAGES: ${{ inputs.published-packages }}
              INPUT_PACKAGES_DIR: ${{ inputs.packages-dir }}
              INPUT_KIND: ${{ inputs.kind }}
              INPUT_PRODUCT: ${{ inputs.product }}
              INPUT_VERSION: ${{ inputs.version }}
              INPUT_FROM_REF: ${{ inputs.from-ref }}
              INPUT_TO_REF: ${{ inputs.to-ref }}
              INPUT_STAGE: ${{ inputs.stage }}
              INPUT_FORMAT: ${{ inputs.format }}
              INPUT_NOTES: ${{ inputs.notes }}
              INPUT_LANGUAGE: ${{ inputs.language }}
              INPUT_INCLUDE_OPEN_PULLS: ${{ inputs.include-open-pulls }}
              INPUT_MAX_SCREENSHOTS: ${{ inputs.max-screenshots }}
              INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
              INPUT_THREAD_ID: ${{ inputs.thread-id }}
              INPUT_ROLE_ID: ${{ inputs.role-id }}
              INPUT_USERNAME: ${{ inputs.username }}
              INPUT_AVATAR_URL: ${{ inputs.avatar-url }}
              INPUT_BUTTON_LABEL: ${{ inputs.button-label }}
              INPUT_BUTTON_URL: ${{ inputs.button-url }}
              INPUT_RELEASE_URL: ${{ inputs.release-url }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url }}
              RELEASE_WEBHOOK_URL: ${{ inputs.callback-url }}
              RELEASE_WEBHOOK_SECRET: ${{ inputs.callback-secret }}
